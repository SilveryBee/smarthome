<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pond Manager Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <script src="pondmanager_mqtt.js" type="text/javascript"></script>
    <script src="pondmanager_ui.js" type="text/javascript" defer></script>
    <style>
        /* Base settings and Responsiveness */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .pond-control-container {
            width: 100%;
            max-width: 700px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 10px;
        }

        /* Status Indicator */
        .status-indicator {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            background-color: #dc3545;
            animation: pulse-offline 2s infinite;
        }
        .status-dot.online {
            background-color: #28a745;
            animation: pulse-online 2s infinite;
        }
        @keyframes pulse-online {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        @keyframes pulse-offline {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Gauge Container - Circular Gauges in Grid */
        .gauges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .gauge-box {
            background-color: #f9f9f9;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .gauge-box h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #555;
            font-size: 1rem;
        }
        
        /* Circular Gauge */
        .circular-gauge {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 10px;
        }
        .circular-gauge svg {
            transform: rotate(-90deg);
        }
        .gauge-circle-bg {
            fill: none;
            stroke: #e0e0e0;
            stroke-width: 12;
        }
        .gauge-circle-fill {
            fill: none;
            stroke: #3498db;
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }
        .gauge-text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }
        .gauge-text-overlay small {
            display: block;
            font-size: 0.7rem;
            font-weight: normal;
            color: #777;
            margin-top: 5px;
        }
        
        /* Valve status styling */
        .valve-closed .gauge-circle-fill {
            stroke: #6c757d;
        }
        .valve-open .gauge-circle-fill {
            stroke: #28a745;
        }
        
        /* Flow gauge color */
        .flow-gauge .gauge-circle-fill {
            stroke: #17a2b8;
        }

        /* Separator */
        .separator {
            border: 0;
            height: 1px;
            background-color: #eee;
            margin: 30px 0;
        }

        /* Manual Controls */
        .manual-controls h2 {
            text-align: center;
            color: #444;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        .form-group input[type="number"] {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-open {
            background-color: #28a745;
        }
        .btn-open:hover {
            background-color: #218838;
        }
        .btn-close {
            background-color: #dc3545;
        }
        .btn-close:hover {
            background-color: #c82333;
        }
        .btn-reset {
            background-color: #6c757d;
        }
        .btn-reset:hover {
            background-color: #5a6268;
        }
        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* Log Container */
        .log-container {
            margin-top: 30px;
            padding: 15px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            height: 200px;
            box-sizing: border-box;
            overflow: hidden;
            width: 100%;
            max-width: 100%;
        }
        .log-container h2 {
            text-align: center;
            color: #444;
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        #logList {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.9rem;
            height: calc(100% - 40px);
            overflow-y: auto;
            box-sizing: border-box;
            max-width: 100%;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        #logList li {
            padding: 8px;
            border-bottom: 1px dotted #eee;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            max-width: 100%;
            box-sizing: border-box;
        }
        #logList li:nth-child(even) {
            background-color: #f1f1f1;
        }
        #logList li:last-child {
            font-weight: bold;
            color: #0056b3;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .gauges-grid {
                grid-template-columns: 1fr;
            }
            .circular-gauge {
                width: 100px;
                height: 100px;
            }
            .gauge-text-overlay {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="pond-control-container">
        <h1>🌊 Pond Water Manager</h1>
        
        <!-- Status Indicator -->
        <div class="status-indicator">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Connecting...</span>
        </div>

        <!-- Gauges Grid -->
        <div class="gauges-grid">
            <!-- Water Level Gauge -->
            <div class="gauge-box">
                <h3>Water Level</h3>
                <div class="circular-gauge">
                    <svg width="120" height="120">
                        <circle class="gauge-circle-bg" cx="60" cy="60" r="52"></circle>
                        <circle class="gauge-circle-fill" id="waterLevelFill" cx="60" cy="60" r="52"
                                stroke-dasharray="327" stroke-dashoffset="327"></circle>
                    </svg>
                    <div class="gauge-text-overlay" id="waterLevelText">
                        --<small>cm</small>
                    </div>
                </div>
            </div>

            <!-- Valve Status Gauge -->
            <div class="gauge-box valve-closed" id="valveGaugeBox">
                <h3>Valve Status</h3>
                <div class="circular-gauge">
                    <svg width="120" height="120">
                        <circle class="gauge-circle-bg" cx="60" cy="60" r="52"></circle>
                        <circle class="gauge-circle-fill" id="valveFill" cx="60" cy="60" r="52"
                                stroke-dasharray="327" stroke-dashoffset="327"></circle>
                    </svg>
                    <div class="gauge-text-overlay" id="valveText">
                        CLOSED
                    </div>
                </div>
            </div>

            <!-- Waterfall Valve Status Gauge -->
            <div class="gauge-box valve-closed" id="waterfallGaugeBox">
                <h3>Waterfall</h3>
                <div class="circular-gauge">
                    <svg width="120" height="120">
                        <circle class="gauge-circle-bg" cx="60" cy="60" r="52"></circle>
                        <circle class="gauge-circle-fill" id="waterfallFill" cx="60" cy="60" r="52"
                                stroke-dasharray="327" stroke-dashoffset="327"></circle>
                    </svg>
                    <div class="gauge-text-overlay" id="waterfallText">
                        OFF
                    </div>
                </div>
            </div>

            <!-- Flow Rate Gauge -->
            <div class="gauge-box flow-gauge">
                <h3>Flow Rate</h3>
                <div class="circular-gauge">
                    <svg width="120" height="120">
                        <circle class="gauge-circle-bg" cx="60" cy="60" r="52"></circle>
                        <circle class="gauge-circle-fill" id="flowFill" cx="60" cy="60" r="52"
                                stroke-dasharray="327" stroke-dashoffset="327"></circle>
                    </svg>
                    <div class="gauge-text-overlay" id="flowText">
                        0.0<small>L/min</small>
                    </div>
                </div>
            </div>
        </div>

        <hr class="separator">

        <!-- Manual Controls -->
        <div class="manual-controls">
            <h2>Manual Control</h2>
            
            <div class="form-group">
                <label for="desiredLevelInput">Desired Water Level (cm from sensor):</label>
                <input type="number" id="desiredLevelInput" min="5" max="70" value="10" step="1">
            </div>

            <div class="form-group">
                <label for="waterIntervalInput">Water Check Interval (minutes):</label>
                <input type="number" id="waterIntervalInput" min="1" max="1440" value="60" step="1">
            </div>
            
            <div class="button-group">
                <button id="openValveBtn" class="btn btn-open">Open Valve</button>
                <button id="closeValveBtn" class="btn btn-close">Close Valve</button>
            </div>
            <div class="button-group" style="margin-top: 10px;">
                <button id="resetDeviceBtn" class="btn btn-reset">Restart Device</button>
            </div>

            <hr class="separator">

            <h2>Waterfall Control</h2>
            <div class="button-group">
                <button id="openWaterfallBtn" class="btn btn-open">Waterfall ON</button>
                <button id="closeWaterfallBtn" class="btn btn-close">Waterfall OFF</button>
            </div>
        </div>

        <hr class="separator">

        <!-- Event Log -->
        <div class="log-container">
            <h2>Event Log 📝</h2>
            <ul id="logList">
            </ul>
        </div>
    </div>

</body>
</html>
